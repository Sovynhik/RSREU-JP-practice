services:
  postgres:
    image: postgres:13
    container_name: pr-work-03
    environment:
      POSTGRES_DB: postgres-pr-03
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data: