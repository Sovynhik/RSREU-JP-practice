<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <style>
        .form-group {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        label {
            width: 150px;
        }
        input {
            width: 200px;
            margin-right: 10px;
        }
        .error {
            color: red;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
<h1>Форма регистрации</h1>

<form action="#" th:action="@{/user/registration}" th:object="${user}" method="post">
    <div class="form-group">
        <label>Имя</label>
        <input type="text" th:field="*{firstName}" />
        <p class="error" th:each="error : ${#fields.errors('firstName')}" th:text="${error}">Ошибка</p>
    </div>
    <div class="form-group">
        <label>Фамилия</label>
        <input type="text" th:field="*{lastName}" />
        <p class="error" th:each="error : ${#fields.errors('lastName')}" th:text="${error}">Ошибка</p>
    </div>
    <div class="form-group">
        <label>Email</label>
        <input type="email" th:field="*{email}" />
        <p class="error" th:each="error : ${#fields.errors('email')}" th:text="${error}">Ошибка</p>
    </div>
    <div class="form-group">
        <label>Пароль</label>
        <input type="password" th:field="*{password}" />
        <p class="error" th:each="error : ${#fields.errors('password')}" th:text="${error}">Ошибка</p>
    </div>
    <div class="form-group">
        <label>Подтверждение пароля</label>
        <input type="password" th:field="*{matchingPassword}" />
        <p class="error" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}">Глобальная ошибка</p>
    </div>
    <div>
        <button type="submit">Зарегистрироваться</button>
    </div>
</form>

<a th:href="@{/login}">Войти</a>
</body>
</html>
